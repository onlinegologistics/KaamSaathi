services:
  mongodb:
    image: mongo:6
    container_name: kaamsaathi-mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: kaamsaathi
    volumes:
      - mongo-data:/data/db
    networks:
      - kaamsaathi-net

  mobile-backend:
    image: demonicorpse23/kaamsaathi-mobile-backend:latest
    container_name: kaamsaathi-mobile-backend
    restart: always
    ports:
      - "5010:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/kaamsaathi
      - JWT_ACCESS_SECRET=${MOBILE_JWT_ACCESS_SECRET:-mobile-access-secret-kaamsaathi-prod-2026}
      - JWT_REFRESH_SECRET=${MOBILE_JWT_REFRESH_SECRET:-mobile-refresh-secret-kaamsaathi-prod-2026}
      - JWT_ACCESS_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - CORS_ORIGIN=*
    depends_on:
      - mongodb
    networks:
      - kaamsaathi-net

  website-backend:
    image: demonicorpse23/kaamsaathi-website-backend:latest
    container_name: kaamsaathi-website-backend
    restart: always
    ports:
      - "5011:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - MONGO_URI=mongodb://mongodb:27017/kaamsaathi
      - JWT_ACCESS_SECRET=${WEB_JWT_ACCESS_SECRET:-web-access-secret-kaamsaathi-prod-2026}
      - JWT_REFRESH_SECRET=${WEB_JWT_REFRESH_SECRET:-web-refresh-secret-kaamsaathi-prod-2026}
      - JWT_ACCESS_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - CORS_ORIGIN=http://admin.smartdial.online
    depends_on:
      - mongodb
    networks:
      - kaamsaathi-net

  website-frontend:
    image: demonicorpse23/kaamsaathi-website-frontend:latest
    container_name: kaamsaathi-website-frontend
    restart: always
    ports:
      - "5012:80"
    networks:
      - kaamsaathi-net

  gateway:
    image: nginx:alpine
    container_name: kaamsaathi-gateway
    restart: always
    ports:
      - "8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - website-frontend
      - website-backend
      - mobile-backend
    networks:
      - kaamsaathi-net

volumes:
  mongo-data:

networks:
  kaamsaathi-net:
    driver: bridge
