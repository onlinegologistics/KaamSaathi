name: CI/CD Pipeline - KaamSaathi

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Mobile Backend
        uses: docker/build-push-action@v5
        with:
          context: ./mobile/backend
          file: ./mobile/backend/Dockerfile
          push: true
          tags: demonicorpse23/kaamsaathi-mobile-backend:latest

      - name: Build and Push Website Backend
        uses: docker/build-push-action@v5
        with:
          context: ./website/backend
          file: ./website/backend/Dockerfile
          push: true
          tags: demonicorpse23/kaamsaathi-website-backend:latest

      - name: Build and Push Website Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./website/frontend
          file: ./website/frontend/Dockerfile
          build-args: |
            VITE_API_BASE_URL=https://api.smartdial.online
          push: true
          tags: demonicorpse23/kaamsaathi-website-frontend:latest

  deploy-to-vps:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            mkdir -p /var/www/kaamsaathi
            cd /var/www/kaamsaathi
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            docker exec giftme-caddy-1 caddy reload --config /etc/caddy/Caddyfile || true
